name: Build release artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.15.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            output: QueryNest-windows-amd64.exe
            artifact: windows-amd64
          - name: macOS Universal
            os: macos-15-intel
            platform: darwin/universal
            output: QueryNest
            artifact: macos-universal

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v5
        with:
          path: .ci-tools
          key: wails-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}-${{ hashFiles('go.mod') }}

      - name: Install Wails CLI on Windows
        if: steps.wails-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-tools | Out-Null
          $env:GOBIN = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION"

      - name: Install Wails CLI on macOS
        if: steps.wails-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p .ci-tools
          GOBIN="$PWD/.ci-tools" go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Add Wails CLI to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Join-Path $env:GITHUB_WORKSPACE '.ci-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Wails CLI to PATH on macOS
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$PWD/.ci-tools" >> "$GITHUB_PATH"

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Build production application
        run: wails build -clean -m -s -skipbindings -trimpath -platform "${{ matrix.platform }}" -o "${{ matrix.output }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "build/bin/${{ matrix.output }}" "release/${{ matrix.output }}"
          $hash = (Get-FileHash "release/${{ matrix.output }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.output }}" | Set-Content "release/${{ matrix.output }}.sha256"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - "build/bin/${{ matrix.output }}.app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "build/bin/${{ matrix.output }}.app" "release/QueryNest-macos-universal.zip"
          cd release
          shasum -a 256 QueryNest-macos-universal.zip > QueryNest-macos-universal.zip.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: QueryNest-${{ matrix.artifact }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
