name: Build and publish release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.15.0
  GOPROXY: https://proxy.golang.org|direct

jobs:
  test-windows:
    name: Test Windows backend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 10))
              echo "Go module download attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to download Go modules after 4 attempts." >&2
          exit 1

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v5
        with:
          path: .ci-tools
          key: wails-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}-${{ hashFiles('go.mod') }}

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 10))
              echo "Go module download attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to download Go modules after 4 attempts." >&2
          exit 1

      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-tools
          for attempt in 1 2 3 4; do
            if GOBIN="$PWD/.ci-tools" go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 15))
              echo "Wails install attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to install Wails CLI after 4 attempts." >&2
          exit 1

      - name: Add Wails CLI to PATH
        shell: bash
        run: echo "$PWD/.ci-tools" >> "$GITHUB_PATH"

      - name: Install NSIS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nsis

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend on Linux
        run: go test ./...

      - name: Vet backend on Linux
        run: go vet ./...

      - name: Build Windows installer
        env:
          QUERYNEST_PORTABLE: "false"
        run: go run ./scripts/build.go -clean -m -s -skipbindings -trimpath -platform windows/amd64 -o QueryNest.exe -nsis

      - name: Package Windows installer
        shell: bash
        run: |
          source='build/bin/QueryNest-amd64-installer.exe'
          test -f "$source"
          mkdir -p release
          cp "$source" release/QueryNestInstaller.exe
          (cd release && sha256sum QueryNestInstaller.exe > QueryNestInstaller.exe.sha256)

      - name: Build Windows portable application
        env:
          QUERYNEST_PORTABLE: "true"
        run: go run ./scripts/build.go -clean -m -s -skipbindings -trimpath -platform windows/amd64 -o QueryNestPortal.exe

      - name: Package Windows portable application
        shell: bash
        run: |
          source='build/bin/QueryNestPortal.exe'
          test -f "$source"
          cp "$source" release/QueryNestPortal.exe
          (cd release && sha256sum QueryNestPortal.exe > QueryNestPortal.exe.sha256)

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: QueryNest-windows-amd64-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS universal app
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v5
        with:
          path: .ci-tools
          key: wails-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}-${{ hashFiles('go.mod') }}

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 10))
              echo "Go module download attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to download Go modules after 4 attempts." >&2
          exit 1

      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-tools
          for attempt in 1 2 3 4; do
            if GOBIN="$PWD/.ci-tools" go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 15))
              echo "Wails install attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to install Wails CLI after 4 attempts." >&2
          exit 1

      - name: Add Wails CLI to PATH
        shell: bash
        run: echo "$PWD/.ci-tools" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build macOS application bundle
        env:
          QUERYNEST_PORTABLE: "false"
        run: go run ./scripts/build.go -clean -m -s -skipbindings -trimpath -platform darwin/universal -o QueryNest

      - name: Package macOS artifact
        shell: bash
        run: |
          app="build/bin/QueryNest.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          test -x "$app/Contents/MacOS/QueryNest"
          test -f "$plist"
          plutil -lint "$plist"
          codesign --force --deep --sign - "$app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$app" release/QueryNest-macos-universal.zip
          cd release
          shasum -a 256 QueryNest-macos-universal.zip > QueryNest-macos-universal.zip.sha256

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: QueryNest-macos-universal-app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - test-windows
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Windows and macOS artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: QueryNest-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Verify release contents
        shell: bash
        run: |
          test -f release/QueryNestInstaller.exe
          test -f release/QueryNestInstaller.exe.sha256
          test -f release/QueryNestPortal.exe
          test -f release/QueryNestPortal.exe.sha256
          test -f release/QueryNest-macos-universal.zip
          test -f release/QueryNest-macos-universal.zip.sha256
          unzip -Z1 release/QueryNest-macos-universal.zip | grep -Fx 'QueryNest.app/Contents/Info.plist'

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "QueryNest build #${GITHUB_RUN_NUMBER}" \
              --notes "Automated production build from main at commit ${GITHUB_SHA}."
          fi
