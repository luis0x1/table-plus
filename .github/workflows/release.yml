name: Build and publish release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.15.0
  GOPROXY: https://proxy.golang.org|direct

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            output: QueryNest-windows-amd64.exe
            artifact: windows-amd64
          - name: macOS Universal
            os: macos-15-intel
            platform: darwin/universal
            output: QueryNest
            artifact: macos-universal

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Wails CLI
        id: wails-cache
        uses: actions/cache@v5
        with:
          path: .ci-tools
          key: wails-${{ runner.os }}-${{ runner.arch }}-${{ env.WAILS_VERSION }}-${{ hashFiles('go.mod') }}

      - name: Download Go modules
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 10))
              echo "Go module download attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to download Go modules after 4 attempts." >&2
          exit 1

      - name: Install Wails CLI on Windows
        if: steps.wails-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-tools | Out-Null
          $env:GOBIN = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 4) {
              $delay = $attempt * 15
              Write-Warning "Wails install attempt $attempt failed; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          throw 'Unable to install Wails CLI after 4 attempts.'

      - name: Install Wails CLI on macOS
        if: steps.wails-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p .ci-tools
          for attempt in 1 2 3 4; do
            if GOBIN="$PWD/.ci-tools" go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 15))
              echo "Wails install attempt $attempt failed; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Unable to install Wails CLI after 4 attempts." >&2
          exit 1

      - name: Add Wails CLI to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Join-Path $env:GITHUB_WORKSPACE '.ci-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Wails CLI to PATH on macOS
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$PWD/.ci-tools" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Build production application
        run: wails build -clean -m -s -skipbindings -trimpath -platform "${{ matrix.platform }}" -o "${{ matrix.output }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "build/bin/${{ matrix.output }}" "release/${{ matrix.output }}"
          $hash = (Get-FileHash "release/${{ matrix.output }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.output }}" | Set-Content "release/${{ matrix.output }}.sha256"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - "build/bin/${{ matrix.output }}.app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "build/bin/${{ matrix.output }}.app" "release/QueryNest-macos-universal.zip"
          cd release
          shasum -a 256 QueryNest-macos-universal.zip > QueryNest-macos-universal.zip.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: QueryNest-${{ matrix.artifact }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Windows and macOS artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: QueryNest-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Verify release contents
        shell: bash
        run: |
          test -f release/QueryNest-windows-amd64.exe
          test -f release/QueryNest-windows-amd64.exe.sha256
          test -f release/QueryNest-macos-universal.zip
          test -f release/QueryNest-macos-universal.zip.sha256

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "QueryNest build #${GITHUB_RUN_NUMBER}" \
              --notes "Automated production build from main at commit ${GITHUB_SHA}."
          fi
